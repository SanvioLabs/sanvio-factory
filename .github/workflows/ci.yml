# The same checks as the pre-commit hook, run on every push and pull request,
# so a check that someone skipped locally still runs before anything merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    # Pinned: ubuntu-latest moved to 26.04 on 2026-11-10, which has no Python 3.9 for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the mod version check below can find the merge base.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      # uv runs the API security tool's generated-authz tests, which need pytest.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The API security tool's own tests
        working-directory: tools/api-security
        run: python3 -m unittest discover -s tests -v
      # Local rules only, metrics off, pinned: the hosted Semgrep platform receives code.
      - name: The API security Semgrep rules
        if: matrix.python == '3.13'
        run: uvx semgrep@1.175.0 --metrics=off --test tools/api-security/semgrep/
      - name: The example's proposals pass their gate
        run: python3 examples/proposal/gates/proposal_gate.py
      - name: Every file name in the Markdown is a link
        run: python3 scripts/link_files.py --check
      - name: Setup check
        run: |
          git config core.hooksPath .githooks
          python3 scripts/check_setup.py
      # Pull requests only, and not in pre-commit: it needs the base branch.
      - name: A changed mod raises its version
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_mod_versions.py "origin/${{ github.base_ref }}"

  # The loop's lock, signals and agent stops on a real Windows (#480). The rest of
  # the suite doesn't run there yet.
  windows:
    name: loop on windows (python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: The loop's Windows tests
        run: python -m unittest tests.test_loop_windows

  # The TypeScript example on the lowest Node it supports. The last step runs its
  # Python test here, where Node is new enough that the test can't skip.
  typescript:
    name: typescript example (node 22.18.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Install
        working-directory: examples/typescript
        run: npm ci
      - name: Typecheck
        working-directory: examples/typescript
        run: npm run typecheck
      - name: Tests
        working-directory: examples/typescript
        run: npm test
      - name: This repo's test runs the example and sees it fail when broken
        run: python3 -m unittest tests.test_typescript_example -v
