# Dependabot opens a pull request each week for an action, an npm package, the
# usage store's image or its Terraform providers that has a newer version. When it bumps an action pinned to a commit SHA, it
# keeps the pin as a SHA and rewrites the `# vX.Y.Z` comment beside it, so no
# setting is needed for that.
#
# Only this repo's own dependencies are listed. Repos cloned into projects/,
# and a copy's own repos, keep their own dependabot.yml.
#
# This file alone doesn't switch on alerts: turn on Dependabot alerts under
# Settings, Code security in the repo on GitHub.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/examples/typescript"
    schedule:
      interval: weekly
  # The usage store's Grafana image (by digest) and its Terraform providers. The DuckDB plugin and its
  # extensions are pinned by hand in examples/usage-store/Dockerfile, with their SHA-256s.
  - package-ecosystem: "docker"
    directory: "/examples/usage-store"
    schedule:
      interval: weekly
  - package-ecosystem: "terraform"
    directory: "/examples/usage-store/cloud"
    schedule:
      interval: weekly
